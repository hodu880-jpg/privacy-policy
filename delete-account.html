<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>계정 삭제 요청 - 제테크 다방</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; color: #333; }
    h1 { color: #1a73e8; }
    .form-group { margin: 16px 0; }
    label { display: block; margin-bottom: 6px; font-weight: 600; }
    input, textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; box-sizing: border-box; }
    button { background: #1a73e8; color: white; border: none; padding: 12px 24px; border-radius: 6px; font-size: 16px; cursor: pointer; margin-top: 10px; }
    .notice { background: #f8f9fa; border-left: 4px solid #1a73e8; padding: 12px 16px; margin: 20px 0; }
  </style>
</head>
<body>
  <h1>계정 삭제 요청</h1>
  <p>제테크 다방 앱의 계정 및 관련 데이터 삭제를 요청하려면 아래 양식을 작성해 주세요.</p>
  <div class="notice"><strong>안내:</strong> 삭제 요청 후 영업일 기준 7일 이내에 처리됩니다.</div>
  <form>
    <div class="form-group">
      <label for="email">가입한 이메일 주소</label>
      <input type="email" id="email" name="email" required placeholder="example@email.com">
    </div>
    <div class="form-group">
      <label for="reason">삭제 사유 (선택)</label>
      <textarea id="reason" name="reason" rows="4"></textarea>
    </div>
    <button type="submit">삭제 요청 제출</button>
  </form>
</body>
